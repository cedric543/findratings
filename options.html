<!DOCTYPE html>
<html>
<head>
  <title>findratings settings</title>
  <style>
    body { padding: 30px; font-family: sans-serif; background: #0f1117; color: #f5f7ff; }
    .card { max-width: 400px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; background: #111318; }
    input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #444; background: #222; color: white; box-sizing: border-box; }
    button { padding: 10px; background: #00e054; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; color: #0f1117; }
    .hint { font-size: 12px; color: #aaa; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>extension setup</h2>
    <p class="hint">get a free key at <a href="https://www.omdbapi.com/apikey.aspx" target="_blank" style="color:#00e054;">omdbapi.com</a></p>
    <label>your omdb api key:</label>
    <input type="text" id="apiKey" placeholder="paste your key here">
    <button id="save">save settings</button>
    <p id="status" style="color:#00e054; margin-top:10px;"></p>
  </div>
  <script src="options.js"></script>
</body>
</html>
